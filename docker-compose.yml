name: monitoring-spbu

services:
  app:
    image: ${DOCKER_IMAGE:-monitoring-spbu:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-Monitoring SPBU}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DB:-monitoring_spbu}"
      DB_USERNAME: "${POSTGRES_USER:-monitoring_spbu}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-secret}"

      CACHE_DRIVER: "${CACHE_DRIVER:-file}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"

      CREATE_STORAGE_LINK: "${CREATE_STORAGE_LINK:-true}"
      LARAVEL_OPTIMIZE: "${LARAVEL_OPTIMIZE:-true}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-monitoring_spbu}"
      POSTGRES_USER: "${POSTGRES_USER:-monitoring_spbu}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  app-storage:
  postgres-data:

networks:
  app-network:
    driver: bridge
