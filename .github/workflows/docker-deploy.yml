name: Build and Deploy Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: monitoring-spbu

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
          echo "sha_tag=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy
          cp docker-compose.yml deploy/docker-compose.yml
          cat > deploy/.env.docker <<'EOF'
          ${{ secrets.VPS_ENV_FILE }}
          EOF

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          VPS_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$VPS_PORT" ]; then VPS_PORT=22; fi
          ssh-keyscan -p "$VPS_PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          VPS_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$VPS_PORT" ]; then VPS_PORT=22; fi
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '${{ secrets.VPS_APP_DIR }}'"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" deploy/docker-compose.yml deploy/.env.docker "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/"

      - name: Pull image and restart on VPS
        run: |
          VPS_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$VPS_PORT" ]; then VPS_PORT=22; fi
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -e
          cd '${{ secrets.VPS_APP_DIR }}'
          echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
          export DOCKER_IMAGE='${{ needs.build.outputs.image_tag }}'
          docker compose --env-file .env.docker pull app
          docker compose --env-file .env.docker up -d --remove-orphans
          docker image prune -f
          EOF
